<svg viewBox="0 0 1000 300" role="img" aria-label="Ciclo de corrección de un defecto: registrar, clasificar, reproducir y corregir, verificar por regresión, cerrar con evidencia" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a1012" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0057D9"/></marker></defs><rect x="4" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="88.0" y="109.0" text-anchor="middle">Registrar</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="88.0" y="190" text-anchor="middle">Versión y</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="88.0" y="214" text-anchor="middle">pasos exactos</text><line x1="176" y1="102" x2="206" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012)"/><rect x="212" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="296.0" y="97.0" text-anchor="middle">Clasificar</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="296.0" y="121.0" text-anchor="middle">(triage)</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="296.0" y="190" text-anchor="middle">Impacto y</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="296.0" y="214" text-anchor="middle">prioridad</text><line x1="384" y1="102" x2="414" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012)"/><rect x="420" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="504.0" y="97.0" text-anchor="middle">Reproducir</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="504.0" y="121.0" text-anchor="middle">y corregir</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="504.0" y="190" text-anchor="middle">Código y</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="504.0" y="214" text-anchor="middle">prueba nueva</text><line x1="592" y1="102" x2="622" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012)"/><rect x="628" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="712.0" y="97.0" text-anchor="middle">Verificar por</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="712.0" y="121.0" text-anchor="middle">regresión</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="712.0" y="190" text-anchor="middle">Compra legítima</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="712.0" y="214" text-anchor="middle">sigue posible</text><line x1="800" y1="102" x2="830" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012)"/><rect x="836" y="50" width="168" height="104" fill="#0057D9" stroke="#0057D9" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" x="920.0" y="97.0" text-anchor="middle">Cerrar con</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" x="920.0" y="121.0" text-anchor="middle">evidencia</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="920.0" y="190" text-anchor="middle">Defecto</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="920.0" y="214" text-anchor="middle">documentado</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="500" y="270" text-anchor="middle">Si hubo cobros reales, resolverlos es un trabajo aparte de corregir el código.</text></svg>