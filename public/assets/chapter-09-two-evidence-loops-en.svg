<svg viewBox="0 0 1000 520" role="img" aria-label="Two loops: a technical one from expected behavior to verification and an experience one from need to learning, connected from learning to expected behavior" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a913" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111418"/></marker></defs><defs><marker id="b913" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0057D9"/></marker></defs><text font-family="Archivo,sans-serif" font-weight="700" font-size="17" fill="#5C6673" x="60" y="34" text-anchor="start">TECHNICAL LOOP</text><rect x="60" y="50" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="155.0" y="94.8" text-anchor="middle">Expected</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="155.0" y="120.0" text-anchor="middle">behavior</text><line x1="254" y1="100" x2="294" y2="100" stroke="#111418" stroke-width="2" marker-end="url(#a913)"/><rect x="300" y="50" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="395.0" y="107.3" text-anchor="middle">Test</text><line x1="494" y1="100" x2="534" y2="100" stroke="#111418" stroke-width="2" marker-end="url(#a913)"/><rect x="540" y="50" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="635.0" y="107.3" text-anchor="middle">Implementation</text><line x1="734" y1="100" x2="774" y2="100" stroke="#111418" stroke-width="2" marker-end="url(#a913)"/><rect x="780" y="50" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="875.0" y="107.3" text-anchor="middle">Verification</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="17" fill="#5C6673" x="60" y="264" text-anchor="start">EXPERIENCE LOOP</text><rect x="60" y="280" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="155.0" y="337.4" text-anchor="middle">Need</text><line x1="254" y1="330" x2="294" y2="330" stroke="#111418" stroke-width="2" marker-end="url(#a913)"/><rect x="300" y="280" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="395.0" y="337.4" text-anchor="middle">Hypothesis</text><line x1="494" y1="330" x2="534" y2="330" stroke="#111418" stroke-width="2" marker-end="url(#a913)"/><rect x="540" y="280" width="190" height="100" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="635.0" y="324.8" text-anchor="middle">Observation</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#111418" x="635.0" y="349.9" text-anchor="middle">or experiment</text><line x1="734" y1="330" x2="774" y2="330" stroke="#111418" stroke-width="2" marker-end="url(#a913)"/><rect x="780" y="280" width="190" height="100" fill="#0057D9" stroke="#0057D9" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="21" fill="#FFFFFF" x="875.0" y="337.4" text-anchor="middle">Learning</text><path d="M875.0 280 L875.0 215 L155.0 215 L155.0 158" fill="none" stroke="#0057D9" stroke-width="2.5" marker-end="url(#b913)"/><rect x="305.0" y="199" width="420" height="32" fill="#FFFFFF"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#0057D9" x="515.0" y="222" text-anchor="middle">Learning changes what