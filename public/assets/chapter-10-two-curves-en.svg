<svg viewBox="0 0 1000 460" role="img" aria-label="Two effort curves over time: the construction curve rises and falls before launch; the results curve starts low and grows afterward, potentially overtaking the first" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1000" height="460" fill="#F7F8FA"/><line x1="70" y1="380" x2="930" y2="380" stroke="#111418" stroke-width="1.5"/><line x1="70" y1="60" x2="70" y2="380" stroke="#111418" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="500" font-size="19" fill="#5C6673" x="500" y="418" text-anchor="middle">Time</text><line x1="460" y1="60" x2="460" y2="380" stroke="#5C6673" stroke-width="2" stroke-dasharray="7 6"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="19" fill="#5C6673" x="460" y="46" text-anchor="middle">Launch</text><polyline points="70,340 160,260 260,170 360,110 460,90 560,120 660,170 760,230 860,280 930,310" fill="none" stroke="#111418" stroke-width="3"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="19" fill="#111418" x="300" y="90" text-anchor="middle">Construction curve</text><polyline points="70,365 160,360 260,350 360,330 460,300 560,240 660,170 760,110 860,70 930,50" fill="none" stroke="#0057D9" stroke-width="3"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="19" fill="#0057D9" x="770" y="150" text-anchor="middle">Results curve</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="930" y="40" text-anchor="end">Illustrative shape; not measured figures</text></svg>