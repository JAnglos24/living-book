<svg viewBox="0 0 1000 300" role="img" aria-label="A defect's fix cycle: log it, triage it, reproduce and fix, verify by regression, close with evidence" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a1012e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0057D9"/></marker></defs><rect x="4" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="88.0" y="109.0" text-anchor="middle">Log it</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="88.0" y="190" text-anchor="middle">Version and</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="88.0" y="214" text-anchor="middle">exact steps</text><line x1="176" y1="102" x2="206" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012e)"/><rect x="212" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="296.0" y="109.0" text-anchor="middle">Triage</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="296.0" y="190" text-anchor="middle">Impact and</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="296.0" y="214" text-anchor="middle">priority</text><line x1="384" y1="102" x2="414" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012e)"/><rect x="420" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="504.0" y="97.0" text-anchor="middle">Reproduce</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="504.0" y="121.0" text-anchor="middle">and fix</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="504.0" y="190" text-anchor="middle">Code and a</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="504.0" y="214" text-anchor="middle">new test</text><line x1="592" y1="102" x2="622" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012e)"/><rect x="628" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="712.0" y="97.0" text-anchor="middle">Verify by</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="712.0" y="121.0" text-anchor="middle">regression</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="712.0" y="190" text-anchor="middle">Legit purchase</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="712.0" y="214" text-anchor="middle">still works</text><line x1="800" y1="102" x2="830" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a1012e)"/><rect x="836" y="50" width="168" height="104" fill="#0057D9" stroke="#0057D9" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" x="920.0" y="97.0" text-anchor="middle">Close with</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" x="920.0" y="121.0" text-anchor="middle">evidence</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="920.0" y="190" text-anchor="middle">Defect</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="17" fill="#5C6673" x="920.0" y="214" text-anchor="middle">documented</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="500" y="270" text-anchor="middle">If real charges happened, making the customer whole is a separate job from fixing the code.</text></svg>