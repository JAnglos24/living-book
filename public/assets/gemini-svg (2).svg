<svg viewBox="0 0 920 400" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF; font-family:'Archivo', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="danger-zone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0057D9" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Subpanel A: Mechanical Hinge (Stress/Strain Curve) -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="415" height="340" rx="4" fill="#F7F8FA" stroke="#C9D0D8" stroke-width="1"/>
    <text x="24" y="32" font-size="11" font-weight="800" fill="#0057D9" letter-spacing="1">PHYSICAL: MECHANICAL HINGE PINION</text>
    <text x="24" y="48" font-size="10" font-family="'Source Serif 4', serif" fill="#5C6673">Stress (σ) vs. Strain (ε) under continuous moment</text>

    <!-- Axes -->
    <line x1="50" y1="70" x2="50" y2="280" stroke="#111418" stroke-width="1.2"/>
    <line x1="50" y1="280" x2="380" y2="280" stroke="#111418" stroke-width="1.2"/>
    <text x="45" y="65" font-size="9" font-weight="700" fill="#5C6673" text-anchor="end">STRESS (LOAD)</text>
    <text x="380" y="300" font-size="9" font-weight="700" fill="#5C6673" text-anchor="end">DEFLECTION / STRAIN</text>

    <!-- Linear Elastic Zone -->
    <line x1="50" y1="280" x2="210" y2="150" stroke="#0057D9" stroke-width="2.5"/>
    <text x="75" y="195" font-size="9" font-weight="700" fill="#0057D9">ELASTIC ZONE</text>
    <text x="75" y="210" font-size="8.5" font-family="'Source Serif 4', serif" fill="#5C6673">Reversible flexure (Hooke's Law)</text>

    <!-- Yield Point Callout -->
    <circle cx="210" cy="150" r="4.5" fill="#111418"/>
    <line x1="210" y1="150" x2="210" y2="280" stroke="#C9D0D8" stroke-dasharray="3 3"/>
    <text x="215" y="142" font-size="9" font-weight="800" fill="#111418">YIELD POINT (σ_y)</text>

    <!-- Plastic Failure Curve -->
    <path d="M 210 150 Q 280 120 360 160" fill="none" stroke="#0057D9" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="250" y="235" font-size="9" font-weight="700" fill="#0057D9">PLASTIC DEFORMATION</text>
    <text x="250" y="250" font-size="8.5" font-family="'Source Serif 4', serif" fill="#5C6673">Irreversible structural buckling</text>
  </g>

  <!-- Subpanel B: Digital API (Throughput vs. Latency) -->
  <g transform="translate(475, 25)">
    <rect x="0" y="0" width="415" height="340" rx="4" fill="#F7F8FA" stroke="#C9D0D8" stroke-width="1"/>
    <text x="24" y="32" font-size="11" font-weight="800" fill="#0057D9" letter-spacing="1">DIGITAL: BACKEND API SERVICE</text>
    <text x="24" y="48" font-size="10" font-family="'Source Serif 4', serif" fill="#5C6673">Latency (p99) vs. Concurrency Throughput</text>

    <!-- Axes -->
    <line x1="50" y1="70" x2="50" y2="280" stroke="#111418" stroke-width="1.2"/>
    <line x1="50" y1="280" x2="380" y2="280" stroke="#111418" stroke-width="1.2"/>
    <text x="45" y="65" font-size="9" font-weight="700" fill="#5C6673" text-anchor="end">LATENCY (MS)</text>
    <text x="380" y="300" font-size="9" font-weight="700" fill="#5C6673" text-anchor="end">CONCURRENT REQ/SEC</text>

    <!-- Stable Latency Zone -->
    <path d="M 50 260 L 220 250" fill="none" stroke="#0057D9" stroke-width="2.5"/>
    <text x="75" y="235" font-size="9" font-weight="700" fill="#0057D9">NOMINAL BAND</text>
    <text x="75" y="250" font-size="8.5" font-family="'Source Serif 4', serif" fill="#5C6673">Predictable response (p50: 18ms)</text>

    <!-- Knee of the Curve / Saturation -->
    <circle cx="220" cy="250" r="4.5" fill="#111418"/>
    <line x1="220" y1="70" x2="220" y2="280" stroke="#C9D0D8" stroke-dasharray="3 3"/>
    <text x="225" y="180" font-size="9" font-weight="800" fill="#111418">SATURATION KNEE</text>
    <text x="225" y="195" font-size="8.5" font-family="'Source Serif 4', serif" fill="#5C6673">DB Pool exhausted</text>

    <!-- Hockey stick exponential explosion -->
    <path d="M 220 250 Q 240 240 280 80" fill="none" stroke="#0057D9" stroke-width="2.5"/>
    <text x="290" y="95" font-size="9" font-weight="800" fill="#0057D9">EXPONENTIAL SPIKE</text>
    <text x="290" y="110" font-size="8.5" font-family="'Source Serif 4', serif" fill="#5C6673">Cascade timeouts &amp; 504 drops</text>
  </g>
</svg>
