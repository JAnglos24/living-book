<svg viewBox="0 0 1000 300" role="img" aria-label="Secuencia de cinco etapas: exposición, comprensión, elegibilidad, intento de canje y recepción del beneficio" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a96" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0057D9"/></marker></defs><rect x="4" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="88.0" y="109.0" text-anchor="middle">Exposición</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="88.0" y="190" text-anchor="middle">Se entera</text><line x1="176" y1="102" x2="206" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a96)"/><rect x="212" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="296.0" y="109.0" text-anchor="middle">Comprensión</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="296.0" y="190" text-anchor="middle">Entiende las</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="296.0" y="214" text-anchor="middle">condiciones</text><line x1="384" y1="102" x2="414" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a96)"/><rect x="420" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="504.0" y="109.0" text-anchor="middle">Elegibilidad</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="504.0" y="190" text-anchor="middle">Alcanza los</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="504.0" y="214" text-anchor="middle">requisitos</text><line x1="592" y1="102" x2="622" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a96)"/><rect x="628" y="50" width="168" height="104" fill="#FFFFFF" stroke="#C9D0D8" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="712.0" y="97.0" text-anchor="middle">Intento</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#111418" x="712.0" y="121.0" text-anchor="middle">de canje</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="712.0" y="190" text-anchor="middle">Pide lo que</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="712.0" y="214" text-anchor="middle">le importa</text><line x1="800" y1="102" x2="830" y2="102" stroke="#0057D9" stroke-width="2" marker-end="url(#a96)"/><rect x="836" y="50" width="168" height="104" fill="#0057D9" stroke="#0057D9" stroke-width="1.5"/><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" x="920.0" y="97.0" text-anchor="middle">Recepción</text><text font-family="Archivo,sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" x="920.0" y="121.0" text-anchor="middle">del beneficio</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="920.0" y="190" text-anchor="middle">Recibe lo</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="920.0" y="214" text-anchor="middle">prometido</text><text font-family="Archivo,sans-serif" font-weight="500" font-size="18" fill="#5C6673" x="500" y="284" text-anchor="middle">Sin cifras: cada transición es un lugar donde buscar la causa.</text></svg>